<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Content Security Policy allowing APIs, OpenWeather icons, and Google Fonts -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' 'unsafe-inline'; 
    connect-src 'self' https://geocoding-api.open-meteo.com https://api.open-meteo.com; 
    img-src 'self' https://openweathermap.org data:;
    font-src 'self' https://fonts.gstatic.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  ">

  <!-- Sophisticated Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Suppress favicon 404 error -->
  <link rel="icon" href="data:,">

  <title>Personal Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body id="app-body" class="weather-default">
  <div class="dashboard">
    <header class="app-header">
      <h1>Weather Dashboard</h1>
      <p id="user-greeting" class="user-greeting">Hello!</p>
    </header>

    <!-- Settings Card -->
    <details id="settings-details" class="settings-card">
      <summary>⚙️ Personal Settings</summary>
      <form id="settings-form" class="settings-form">
        <div class="form-group">
          <label for="name-input">Your Name</label>
          <input type="text" id="name-input" placeholder="e.g. Alex" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="sensitivity-select">How do you run?</label>
          <select id="sensitivity-select">
            <option value="cold">❄️ Run Cold (-7°F)</option>
            <option value="neutral" selected>⚖️ Neutral (Standard)</option>
            <option value="hot">🔥 Run Hot (+7°F)</option>
          </select>
        </div>
        <button type="submit" class="save-btn">Save Preferences</button>
      </form>
    </details>

    <!-- Search Form -->
    <form id="search-form" class="search-form">
      <input 
        type="text" 
        id="city-input" 
        placeholder="Enter city name..." 
        required 
        autocomplete="off"
      />
      <button type="submit">Search</button>
    </form>

    <!-- Status / Error Messages -->
    <div id="status-message" class="status-message hidden"></div>

    <!-- Current Weather Display -->
    <main id="weather-card" class="weather-card hidden">
      <div class="location-info">
        <h2 id="city-name">--</h2>
        <p id="weather-description">--</p>
      </div>

      <div class="weather-main">
        <img id="weather-icon" src="" alt="Weather Icon" class="weather-icon" />
        <div class="temp-display">
          <span id="temp-fahrenheit" class="temp-main">--°F</span>
          <span id="temp-celsius" class="temp-sub">--°C</span>
          <span id="feels-like-tag" class="feels-like-tag">Feels like you: --°F</span>
        </div>
      </div>

      <div class="weather-details">
        <div class="detail-item">
          <span class="detail-label">Humidity</span>
          <span id="humidity" class="detail-value">--%</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Wind</span>
          <span id="wind-speed" class="detail-value">-- mph</span>
        </div>
      </div>

      <!-- Sophisticated Mini Me Fox Mascot Section -->
      <div class="mini-me-container">
        <div class="mascot-wrapper">
          <svg class="mascot-svg" viewBox="0 0 100 100" width="55" height="55" aria-label="Sophisticated Mini Me Fox Mascot">
            <!-- Sleek Sharp Ears -->
            <polygon points="15,10 38,42 12,35" fill="#0369a1" />
            <polygon points="19,16 32,38 16,32" fill="#bae6fd" />
            <polygon points="85,10 62,42 88,35" fill="#0369a1" />
            <polygon points="81,16 68,38 84,32" fill="#bae6fd" />
            <!-- Modern Geometric Head -->
            <polygon points="50,92 12,38 88,38" fill="#0284c7" />
            <!-- Polished White Muzzle Accent -->
            <polygon points="50,92 22,50 78,50" fill="#f0f9ff" />
            <polygon points="50,92 35,62 65,62" fill="#ffffff" />
            <!-- Expressive Sophisticated Eyes -->
            <polygon points="32,46 38,52 32,54" fill="#0f172a" />
            <polygon points="68,46 62,52 68,54" fill="#0f172a" />
            <!-- Refined Nose -->
            <polygon points="50,78 45,70 55,70" fill="#0f172a" />
          </svg>
        </div>
        <div class="speech-bubble">
          <strong id="mini-me-title">Mini Me says:</strong>
          <p id="mini-me-advice">Search a city to get your personalized weather advice!</p>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
