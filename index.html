<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body id="app-body" class="weather-default">
  <div class="dashboard">
    <header class="app-header">
      <h1>Weather Dashboard</h1>
      <p id="user-greeting" class="user-greeting">Hello!</p>
    </header>

    <!-- Settings Card -->
    <details class="settings-card">
      <summary>⚙️ Personal Settings</summary>
      <form id="settings-form" class="settings-form">
        <div class="form-group">
          <label for="name-input">Your Name</label>
          <input type="text" id="name-input" placeholder="e.g. Alex" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="sensitivity-select">How do you run?</label>
          <select id="sensitivity-select">
            <option value="cold">❄️ Run Cold (-7°F)</option>
            <option value="neutral" selected>⚖️ Neutral (Standard)</option>
            <option value="hot">🔥 Run Hot (+7°F)</option>
          </select>
        </div>
        <button type="submit" class="save-btn">Save Preferences</button>
      </form>
    </details>

    <!-- Search Form -->
    <form id="search-form" class="search-form">
      <input 
        type="text" 
        id="city-input" 
        placeholder="Enter city name..." 
        required 
        autocomplete="off"
      />
      <button type="submit">Search</button>
    </form>

    <!-- Status / Error Messages -->
    <div id="status-message" class="status-message hidden"></div>

    <!-- Current Weather Display -->
    <main id="weather-card" class="weather-card hidden">
      <div class="location-info">
        <h2 id="city-name">--</h2>
        <p id="weather-description">--</p>
      </div>

      <div class="weather-main">
        <img id="weather-icon" src="" alt="Weather Icon" class="weather-icon" />
        <div class="temp-display">
          <span id="temp-fahrenheit" class="temp-main">--°F</span>
          <span id="temp-celsius" class="temp-sub">--°C</span>
          <span id="feels-like-tag" class="feels-like-tag">Feels like you: --°F</span>
        </div>
      </div>

      <div class="weather-details">
        <div class="detail-item">
          <span class="detail-label">Humidity</span>
          <span id="humidity" class="detail-value">--%</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Wind</span>
          <span id="wind-speed" class="detail-value">-- mph</span>
        </div>
      </div>

      <!-- Mini Me Animal Friend Section -->
      <div class="mini-me-container">
        <div class="mascot-wrapper">
          <svg class="mascot-svg" viewBox="0 0 100 100" width="55" height="55" aria-label="Mini Me Fox Mascot">
            <polygon points="18,15 38,45 10,40" fill="#0284c7" />
            <polygon points="22,22 34,42 15,38" fill="#e0f2fe" />
            <polygon points="82,15 62,45 90,40" fill="#0284c7" />
            <polygon points="78,22 66,42 85,38" fill="#e0f2fe" />
            <polygon points="50,90 10,40 90,40" fill="#0284c7" />
            <polygon points="50,90 10,40 38,58" fill="#ffffff" />
            <polygon points="50,90 90,40 62,58" fill="#ffffff" />
            <circle cx="34" cy="50" r="4.5" fill="#0f172a" />
            <circle cx="66" cy="50" r="4.5" fill="#0f172a" />
            <circle cx="35.5" cy="48.5" r="1.5" fill="#ffffff" />
            <circle cx="67.5" cy="48.5" r="1.5" fill="#ffffff" />
            <polygon points="50,88 44,78 56,78" fill="#0f172a" />
          </svg>
        </div>
        <div class="speech-bubble">
          <strong id="mini-me-title">Mini Me says:</strong>
          <p id="mini-me-advice">Search a city to get your personalized weather advice!</p>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
