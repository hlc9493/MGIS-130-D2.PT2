<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body id="app-body" class="weather-default">
  <div class="dashboard">
    <header class="app-header">
      <h1>Weather Dashboard</h1>
      <p id="user-greeting" class="user-greeting">Hello!</p>
    </header>

    <!-- Settings Card -->
    <details class="settings-card">
      <summary>⚙️ Personal Settings</summary>
      <form id="settings-form" class="settings-form">
        <div class="form-group">
          <label for="name-input">Your Name</label>
          <input type="text" id="name-input" placeholder="e.g. Alex" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="sensitivity-select">How do you run?</label>
          <select id="sensitivity-select">
            <option value="cold">❄️ Run Cold (-7°F)</option>
            <option value="neutral" selected>⚖️ Neutral (Standard)</option>
            <option value="hot">🔥 Run Hot (+7°F)</option>
          </select>
        </div>
        <button type="submit" class="save-btn">Save Preferences</button>
      </form>
    </details>

    <!-- UI Layer: Search Form -->
    <form id="search-form" class="search-form">
      <input 
        type="text" 
        id="city-input" 
        placeholder="Enter city name..." 
        required 
        autocomplete="off"
      />
      <button type="submit">Search</button>
    </form>

    <!-- UI Layer: Status / Error Messages -->
    <div id="status-message" class="status-message hidden"></div>

    <!-- UI Layer: Current Weather Display -->
    <main id="weather-card" class="weather-card hidden">
      <div class="location-info">
        <h2 id="city-name">--</h2>
        <p id="weather-description">--</p>
      </div>

      <div class="weather-main">
        <img id="weather-icon" src="" alt="Weather Icon" class="weather-icon" />
        <div class="temp-display">
          <span id="temp-fahrenheit" class="temp-main">--°F</span>
          <span id="temp-celsius" class="temp-sub">--°C</span>
          <span id="feels-like-tag" class="feels-like-tag">Feels like you: --°F</span>
        </div>
      </div>

      <div class="weather-details">
        <div class="detail-item">
          <span class="detail-label">Humidity</span>
          <span id="humidity" class="detail-value">--%</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Wind</span>
          <span id="wind-speed" class="detail-value">-- mph</span>
        </div>
      </div>

      <!-- Mini Me Animal Friend Section -->
      <div class="mini-me-container">
        <!-- Cute SVG Fox Character -->
        <div class="mascot-wrapper">
          <svg class="mascot-svg" viewBox="0 0 100 100" width="6
